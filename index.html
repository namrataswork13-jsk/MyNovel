  .chapter-list li .num {

  /* ===== PAGE INFO ===== */
  .page-info {

    bottom: 18px;
    left: 50%;

    background: rgba(20,10,5,0.8);

    border-radius: 20px;

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .book {
      width: 96vw;
      height: 80vh;

    .page { padding: 30px 28px 50px; }
    .nav-arrow { width: 42px; height: 42px; font-size: 18px; }
    .nav-prev { left: 8px; }
    .nav-next { right: 8px; }
    .topbar .title { font-size: 14px; }

    .book-spine { display: none; }
    .page { padding: 25px 22px 50px; }
    .nav-prev { left: 6px; }
    .nav-next { right: 6px; }
  }
</style>
</head>

  {
    chapter: 1,
    title: 'The Girl Who Believed',
    content: `“Life is messed up rn!” Lia shouted from across the room.
“You better get it right or I’ll kill you!” Jean shouted back from another corner.
And that was how most mornings started in the Flynn household.
Lia was eighteen, a tech major pursuing her diploma, and, according to Jean, a complete disaster when it came to getting ready on time.
Jean was two years older, an architecture major, and somehow managed to look put together even when she had ten minutes to get ready.
They went to the same university, which was either the best thing that had ever happened to them or the worst. Neither of them had decided yet.
Sometimes they were best friends. Sometimes they were enemies. And sometimes they genuinely looked like they were one argument away from killing each other.
“Where is my black top?” Lia yelled.
“You have seventeen black tops!”
“That's not the point.”
“What is the point?”
“The one I want is missing.”
Jean sighed. “Of course it is.”
Lia finally found the top buried under a pile of clothes on her bed. “There!”
Jean looked at her. “You're unbelievable.”
“Thank you.”
“That wasn't a compliment.”
“I chose to take it as one.”
Jean rolled her eyes and grabbed her bag. Lia followed her downstairs, still fixing her hair as they walked.
They hopped into their car, Jean taking the driver's seat while Lia connected her phone to the speakers. A few seconds later, Taylor Swift started playing.
Jean immediately looked at her. “No.”
Lia smiled. “Yes.”
“Lia.”
“I knew you were trouble when you walked in…”
“I'm turning this off.”
“...so shame on me now.”
Jean reached for the phone. Lia moved it away.
“Don't you dare!”
“You know I hate this song.”
“Exactly.”
“You are so annoying.”
“And yet you love me.”
Jean stared at her for a second before starting the car. “Unfortunately.”
Lia smiled and turned the volume up. She had always been like that. Full of life. Or at least, she liked to think she was.
Lia was the kind of person who could romanticize almost anything. A rainy afternoon. A stranger smiling at her in the hallway. Someone holding the door open for another person. A song playing at the exact right moment. She read romance books like they were instruction manuals for life. She listened to Taylor Swift like every song had been written specifically about her. She believed in coincidences, signs, timing, and the idea that maybe, somewhere out there, someone was waiting for her. Which was funny, because Lia Flynn had been single for as long as she could remember.
“Single since birth,” she liked to say.
She wasn't desperate for a relationship. At least, that's what she told everyone. She was actually quite happy.
She was one of the smartest students in her class, although she rarely acted like it. She'd procrastinate, complain about assignments, spend hours reading something completely unrelated to college, and then somehow sit down the night before an exam and get the grades.
Life was pretty fine. Nothing extraordinary. Nothing terrible. She had Jean. She had her friends. She had college. She had books. She had music. She had a life she was slowly figuring out. And for an eighteen-year-old, that was enough.
Until one day, the world stopped.
“It’s a lockdown.”
The news reporter said it like those two words were enough to explain everything. Lia stared at the television. Jean stood beside her, arms crossed.
“What does that even mean?”
“I don't know.”
“You're the smart one.”
“I am not the smart one.”
“You literally study tech.”
“That doesn't mean I know what's happening with the world.”
They both looked back at the television. People were talking about a virus. Cases. Hospitals. Restrictions. Something called COVID-19 that none of them had really heard about before. And suddenly, everyone was scared. Lia grabbed the keys.
“We need groceries.”
Jean looked at her. “Now?”
“Yes, now.”
“Why?”
“Because apparently the entire world is ending.”
“That's dramatic.”
“Have you seen the news?”
“Yes.”
“Then let's go.”
They rushed out, the streets were crowded. People were everywhere, trying to buy whatever they could before everything closed. There was panic in the air, people were talking loudly. Stores were getting emptied. And for the first time, Lia saw something she'd never really seen before. Fear. Real fear. The kind that made people unsure of what tomorrow would look like.
Lia and Jean lived alone. Their parents had transferable jobs and were usually moving from one place to another, so the sisters had gotten used to managing things themselves.
But this felt different. There was no college. No going out. No random plans. No normal days.
The streets were slowly becoming empty. And everyone was being told to stay inside.
For a few days, they thought. Maybe a couple of weeks. It couldn't possibly last longer than that. Right?
It did.
Days turned into weeks. Weeks turned into months. And eventually, nobody even remembered what a normal day was supposed to feel like.
Jean spent hours texting and calling the guy she was dating. Lia watched. She smiled for her sister. She teased her. She pretended she wasn't jealous of the fact that Jean had someone to call at the end of the day.
Because Lia had always romanticized love, but somehow, love had never really found its way to her.
At first, lockdown felt almost like a vacation. Then it became boring. Then lonely. And then the loneliness started feeling normal.
Lia studied. She watched movies. She read books. She listened to music. She scrolled through Instagram for hours. She'd wake up, look at her phone, complain about having online classes, attend them while barely paying attention, and then somehow end up back on Instagram.
One afternoon, she was scrolling through one of the fandom pages she followed. Someone had posted something about one of the idols not being talented enough to be in the group. The comments were a mess. People were arguing. People were insulting each other. People were acting like they personally owned the group. Lia stared at the screen.
“Oh my God.”
She kept scrolling. Someone said the idol couldn't sing. Someone else said they couldn't dance. Someone else said they shouldn't even be in the group.
Lia couldn't stop herself. She typed a reply.
And then she saw a comment from someone named jam2504.
“You don't get to decide who stays or leaves the group. You can't even dance and sing at once.”
Lia stared at the comment. Then smiled. “Atta boy.”
She liked the comment. Then, without thinking much about it, replied: “Exactly!”
She put her phone down and went back to her college assignment. For the next hour, she completely forgot about it. Then she picked up her phone again.
One notification. Instagram.
jam2504 has requested to follow you.
Lia stared at the screen. For some reason, her heart skipped. She frowned.
“It’s just Instagram.”
She stared at the notification again. Then smiled. “Okay…”
Maybe lockdown wasn't going to be that boring after all.`

jam2504 has requested to follow you.

Three dots appeared. Then disappeared. Then appeared again. She laughed. And that was it.

And then James started flirting. Nothing serious. Just little comments here and there. Enough to make Lia blush. Enough to make her put her phone down for a few seconds before picking it up again.

Eventually, James texted: “I'm James by the way. It was really nice talking to you.”
Lia smiled before replying. “Oh James, I'm Lia. It was great having a conversation with you too.”
They kept talking. For hours. It was well past midnight when Lia finally looked at the time. She should have been sleeping. Instead, she was staring at her phone.
There was only one problem. James was two years younger than her. Two years. Which obviously meant there was absolutely no chance that James would ever become her love interest. Right? Right. Obviously.
The next morning, Lia woke up and reached for her phone before she had even properly opened her eyes. There was a message waiting for her.
James: “Good morning, JBoy gurl.”
Lia smiled. She didn't even realize she was smiling. Until —
“Why are you happy?”

/* ============================================================
   PAGE SPLITTING LOGIC
   ============================================================ */
const CHAR_PER_PAGE = 1800; // approximate characters per page
const pages = []; // each entry: { type, chapter, title, html }

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatContent(text) {
  // split into paragraphs
  const raw = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  let html = '';
  for (const p of raw) {
    // scene break detection
    if (/^[-–—*]{3,}$/.test(p) || /^\s*[*·]\s*[*·]\s*[*·]\s*$/.test(p)) {
      html += `<div class="scene-break">❦ ❦ ❦</div>`;
      continue;
    }
    // dialogue detection (starts with quote)
    const isDialogue = /^["“]/.test(p);
    const escaped = escapeHTML(p).replace(/\n/g, '<br>');
    html += `<p${isDialogue ? ' class="dialogue"' : ''}>${escaped}</p>`;
  }
  return html;
}

function splitIntoPages() {
  for (const section of novel) {
    if (section.type === 'cover') {
      pages.push({
        type: 'cover',
        title: section.title,
        subtitle: section.subtitle,
        author: section.author,
        tagline: section.tagline,
        chapter: null
      });
      continue;
    }
    // chapter start page
    pages.push({
      type: 'chapterStart',
      chapter: section.chapter,
      title: section.title,
      html: ''
    });
    // split content into chunks
    const formatted = formatContent(section.content);
    // split by paragraph tags for clean page breaks
    const paraList = formatted.match(/<p[^>]*>[\s\S]*?<\/p>|<div[^>]*>[\s\S]*?<\/div>/g) || [];
    let current = '';
    let currentLen = 0;
    for (const para of paraList) {
      const paraLen = para.replace(/<[^>]+>/g,'').length;
      if (currentLen + paraLen > CHAR_PER_PAGE && currentLen > 0) {
        pages.push({
          type: 'content',
          chapter: section.chapter,
          title: section.title,
          html: current
        });
        current = para;
        currentLen = paraLen;
      } else {
        current += para;
        currentLen += paraLen;
      }
    }
    if (current) {
      pages.push({
        type: 'content',
        chapter: section.chapter,
        title: section.title,
        html: current
      });
    }
  }
}
splitIntoPages();

/* ============================================================
   RENDERING
   ============================================================ */
const pageLeft = document.getElementById('pageLeft');
const pageRight = document.getElementById('pageRight');
const contentLeft = document.getElementById('contentLeft');
const contentRight = document.getElementById('contentRight');
const numLeft = document.getElementById('numLeft');
const numRight = document.getElementById('numRight');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');
const chapterMenu = document.getElementById('chapterMenu');
const chapterList = document.getElementById('chapterList');
const chapterBtn = document.getElementById('chapterBtn');
const viewToggle = document.getElementById('viewToggle');
const sizeUp = document.getElementById('sizeUp');
const sizeDown = document.getElementById('sizeDown');

let currentIndex = 0;
let singlePageMode = false;
let isAnimating = false;
let fontSize = 18;

function renderCover(page, target) {
  target.innerHTML = `
    <div class="cover">
      <div class="author">${escapeHTML(page.author)}</div>
      <div class="cover-ornament">❦ ❦ ❦</div>
      <div class="book-title">
        ${escapeHTML(page.title)}
        <em>${escapeHTML(page.subtitle)}</em>
      </div>
      <div class="cover-ornament">✦ ✦ ✦</div>
      <div class="tagline">${escapeHTML(page.tagline)}</div>
    </div>
  `;
}

function renderChapterStart(page, target) {
  target.innerHTML = `
    <div class="chapter-title">Chapter ${page.chapter}</div>
    <div class="ornament">❦ ❦ ❦</div>
    <div class="chapter-subtitle">${escapeHTML(page.title)}</div>
  `;
}

function renderContent(page, target) {
  target.innerHTML = page.html;
}

function renderPage(index, target, numTarget) {
  const page = pages[index];
  if (!page) {
    target.innerHTML = '';
    numTarget.textContent = '';
    return;
  }
  if (page.type === 'cover') {
    renderCover(page, target);
    numTarget.textContent = '';
  } else if (page.type === 'chapterStart') {
    renderChapterStart(page, target);
    numTarget.textContent = '';
  } else {
    renderContent(page, target);
    numTarget.textContent = `— ${index} —`;
  }
}

function render() {
  if (singlePageMode) {
    pageLeft.style.display = 'none';
    pageRight.style.left = '0';
    pageRight.style.width = '100%';
    renderPage(currentIndex, contentRight, numRight);
  } else {
    pageLeft.style.display = '';
    pageRight.style.left = '50%';
    pageRight.style.width = '50%';
    renderPage(currentIndex, contentLeft, numLeft);
    renderPage(currentIndex + 1, contentRight, numRight);
  }
  updateControls();
}

function updateControls() {
  const maxIndex = singlePageMode ? pages.length - 1 : pages.length - 2;
  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= maxIndex;

  const page = pages[currentIndex];
  if (page.type === 'cover') {
    pageInfo.textContent = 'Cover';
  } else if (page.type === 'chapterStart') {
    pageInfo.textContent = `Chapter ${page.chapter} — ${page.title}`;
  } else {
    const total = singlePageMode ? pages.length : Math.ceil(pages.length / 2);
    const current = singlePageMode ? currentIndex + 1 : Math.floor(currentIndex / 2) + 1;
    pageInfo.textContent = `Page ${current} of ${total}`;
  }

  // highlight current chapter in menu
  document.querySelectorAll('.chapter-list li').forEach((li, i) => {
    li.classList.toggle('current', i === getCurrentChapterIndex());
  });
}

function getCurrentChapterIndex() {
  const currentChapter = pages[currentIndex].chapter;
  const chapters = novel.filter(n => n.chapter).map(n => n.chapter);
  if (!currentChapter) return 0;
  return chapters.indexOf(currentChapter) + 1; // +1 because 0 = cover
}

function goTo(index) {
  if (isAnimating) return;
  if (singlePageMode) {
    if (index < 0 || index >= pages.length) return;
  } else {
    if (index < 0 || index > pages.length - 2) return;
    // keep even index for left page
    if (index % 2 !== 0) index = index - 1;
    if (index < 0) index = 0;
  }
  const direction = index > currentIndex ? 'forward' : 'backward';
  animateFlip(direction, () => {
    currentIndex = index;
    render();
  });
}

function animateFlip(direction, callback) {
  isAnimating = true;
  const flippingPage = direction === 'forward' ? pageLeft : pageRight;
  flippingPage.classList.add(direction === 'forward' ? 'flipping-forward' : 'flipping-backward');
  setTimeout(() => {
    flippingPage.classList.remove('flipping-forward', 'flipping-backward');
    isAnimating = false;
    callback();
  }, 900);
}

function nextPage() {
  if (isAnimating) return;
  const step = singlePageMode ? 1 : 2;
  const maxIndex = singlePageMode ? pages.length - 1 : pages.length - 2;
  if (currentIndex + step > maxIndex) return;
  animateFlip('forward', () => {
    currentIndex += step;
    render();
  });
}

function prevPage() {
  if (isAnimating) return;
  const step = singlePageMode ? 1 : 2;
  if (currentIndex - step < 0) return;
  animateFlip('backward', () => {
    currentIndex -= step;
    render();
  });
}

prevBtn.addEventListener('click', prevPage);
nextBtn.addEventListener('click', nextPage);

// keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextPage();
  else if (e.key === 'ArrowLeft') prevPage();
});

// click on pages to flip
pageLeft.addEventListener('click', (e) => {
  if (e.target.closest('.page-content')) return;
  prevPage();
});
pageRight.addEventListener('click', (e) => {
  if (e.target.closest('.page-content')) return;
  nextPage();
});

// chapter menu
function buildChapterMenu() {
  let html = `<li data-index="0"><span>Cover</span><span class="num">—</span></li>`;
  let i = 1;
  for (const section of novel) {
    if (section.chapter) {
      // find first page index of this chapter
      const pageIdx = pages.findIndex(p => p.type === 'chapterStart' && p.chapter === section.chapter);
      html += `<li data-index="${pageIdx}"><span>Ch. ${section.chapter}: ${escapeHTML(section.title)}</span><span class="num">${pageIdx}</span></li>`;
    }
    i++;
  }
  chapterList.innerHTML = html;
  chapterList.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      const idx = parseInt(li.dataset.index);
      goTo(idx);
      chapterMenu.classList.remove('open');
    });
  });
}
buildChapterMenu();

chapterBtn.addEventListener('click', () => {
  chapterMenu.classList.toggle('open');
});

// view toggle
viewToggle.addEventListener('click', () => {
  singlePageMode = !singlePageMode;
  viewToggle.textContent = singlePageMode ? 'Double Page' : 'Single Page';
  viewToggle.classList.toggle('active', singlePageMode);
  // adjust current index
  if (singlePageMode) {
    // stay on same chapter
  } else {
    if (currentIndex % 2 !== 0) currentIndex = currentIndex - 1;
    if (currentIndex < 0) currentIndex = 0;
  }
  render();
});

// font size
function setFontSize(size) {
  fontSize = Math.max(14, Math.min(26, size));
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  // re-render pages (content may need reflow)
  render();
}
sizeUp.addEventListener('click', () => setFontSize(fontSize + 1));
sizeDown.addEventListener('click', () => setFontSize(fontSize - 1));

// initial render
render();
</script>
